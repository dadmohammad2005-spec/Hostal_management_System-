services:
  - type: web
    name: hostal-management-system
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn smart_hostel.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
